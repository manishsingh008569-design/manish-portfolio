
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manish Singh | Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1224;
      color: white;
      text-align: center;
    }
    header, footer {
      background: #151f38;
      padding: 20px;
    }
    h2, span {
      color: #60a5fa;
    }
    .hero {
      padding: 50px 20px;
    }
    .avatar {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid #60a5fa;
    }
    .button {
      background: #2563eb;
      color: white;
      padding: 12px 22px;
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }
    section {
      padding: 25px 20px;
    }
    .skill {
      display: inline-block;
      background: #1e2a45;
      padding: 12px;
      margin: 5px;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <header>
    <h2>MANISH.</h2>
    <p>My Personal Portfolio</p>
  </header>

  <div class="hero">
    <img src="manish.jpg" alt="Manish profile picture" class="avatar">
    <h1>Hello, I'm <span>Manish Singh</span></h1>
    <p>Welcome to my personal portfolio website!</p>
    <p>I am learning HTML, CSS and JavaScript.</p>
    <button class="button" onclick="document.getElementById('message').textContent='Thanks for visiting my website!'">Contact Me</button>
    <p id="message"></p>
  </div>

  <section>
    <h2>About Me</h2>
    <p>I enjoy learning technology and creating websites.</p>
  </section>

  <section>
    <h2>My Skills</h2>
    <div class="skill">HTML</div>
    <div class="skill">CSS</div>
    <div class="skill">JavaScript</div>
  </section>

  <footer>
    <p>Made by Manish Singh</p>
  </footer>
</body>
</html>
